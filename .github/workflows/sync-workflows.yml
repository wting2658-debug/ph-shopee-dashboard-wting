name: Sync workflow configuration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-workflows.yml"

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure daily refresh runs at 06:00 Beijing time
        run: |
          set -euo pipefail
          FILE=".github/workflows/refresh-dashboard.yml"
          if grep -q 'cron: "0 22 \* \* \*"' "$FILE"; then
            echo "Schedule already correct."
            exit 0
          fi
          sed -i 's|cron: "50 2 \* \* \*"|cron: "0 22 * * *"|; /cron: "20 3 \* \* \*"/d' "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Schedule daily refresh at 06:00 Beijing time"
          git push
