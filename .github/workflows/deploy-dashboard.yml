name: Deploy dashboard to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "functions/**"
      - "assets/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh dashboard data"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-dashboard-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets."
            exit 1
          fi
          DEPLOY_SHA="$(git rev-parse HEAD)"
          bash scripts/deploy.sh \
            --branch main \
            --commit-hash "$DEPLOY_SHA" \
            --commit-message "${DEPLOY_SHA::8}"
