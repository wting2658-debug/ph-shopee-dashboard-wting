name: Refresh dashboard data

on:
  schedule:
    # 每天北京时间 06:00 刷新数据（UTC 22:00 前一日）
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-dashboard-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Download latest Google Sheet data
        run: python scripts/download_sheet_data.py

      - name: Process shipment data
        run: python process_shipment_data.py

      - name: Process subsidy data
        run: python process_subsidy_data.py

      - name: Rebuild dashboard
        run: python build_flagship_onsite_page1.py

      - name: Commit refreshed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html shipment_data.json subsidy_data.json
          if git diff --cached --quiet; then
            echo "Dashboard is already up to date."
            exit 0
          fi
          git commit -m "Refresh dashboard data"
          git push
